services:
  todoapp_client:
    container_name: todoapp_client
    restart: always
    build:
      dockerfile: Dockerfile
      context: frontend
    ports:
      - "8081:80"
    depends_on:
      - todoapp_server
    networks:
      - todoapp_network

  todoapp_server:
    container_name: todoapp_server
    restart: always
    build:
      dockerfile: Dockerfile
      context: backend
    ports:
      - "8080:8080"
    environment:
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?run "make env" to generate .env}
      MONGO_URL: mongodb://${MONGO_ROOT_USER:?missing in .env}:${MONGO_ROOT_PASSWORD:?missing in .env}@todoapp_mongodb:27017/?authSource=admin
      MONGO_DB_NAME: todo
      ALLOWED_ORIGIN: http://localhost:8081
      LOG_LEVEL: info
    depends_on:
      todoapp_mongodb:
        condition: service_healthy
    networks:
      - todoapp_network

  todoapp_mongodb:
    container_name: todoapp_mongodb
    restart: always
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?missing in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?missing in .env}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - todoapp_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus:/etc/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    networks:
      - todoapp_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - todoapp_network

networks:
  todoapp_network:

volumes:
  mongo-data:
    driver: local
  prometheus:
    driver: local
  grafana:
    driver: local
