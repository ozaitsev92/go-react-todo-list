apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-frontend
  namespace: todo-app
spec:
  ingressClassName: nginx
  rules:
  - host: todo-app.example.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: react-frontend
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-app-api
  namespace: todo-app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
  - host: todo-app.example.local
    http:
      paths:
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: go-backend
            port:
              number: 8080
