apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: todo-app
data:
  BIND_ADDR: "8080"
  LOG_LEVEL: "info"
  STORAGE: "mongo"
  MONGO_DB_NAME: "todo"
  JWT_ISSUER: "todo-api"
  JWT_SESSION_LENGTH: "30"
  JWT_SECURE_COOKIE: "true"
  JWT_COOKIE_DOMAIN: ""
  ALLOWED_ORIGIN: "https://todo-app.example.local"
